# Dev/HTTP: mantem porta 80.
# Em producao, o TLS deve ser terminado no reverse proxy a frente do container
# nginx (http://10.10.10.208:8000), que tambem envia Strict-Transport-Security.
# O app ja emite HSTS via PHP quando detecta HTTPS (isHttpsRequest).
# Este VirtualHost fica somente em HTTP.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /var/www/html>
        Require all denied
    </Directory>

    # IP real do cliente atras do proxy nginx (mod_remoteip). A conf e gerada
    # no start do container por docker/entrypoint.sh (a sub-rede Docker varia
    # por host/projeto) e gravada no tmpfs /etc/visitantes/remoteip. Sem o
    # arquivo o app continua funcionando, porem com o IP do nginx em
    # REMOTE_ADDR. Ver docker-compose.yml (tmpfs) e inc/security.php.
    IncludeOptional /etc/visitantes/remoteip/*.conf

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
    </IfModule>
</VirtualHost>
