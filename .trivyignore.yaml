# Excecoes justificadas do scan Trivy para imagens de terceiros.
#
# Aplicado somente ao scan da imagem oficial mysql:8.4. O workflow passa este
# arquivo explicitamente (trivyignores: .trivyignore.yaml), pois o formato YAML
# exige --ignorefile. Cada excecao tem prazo: depois de expired_at o Trivy
# volta a falhar e a equipe precisa reavaliar (atualizar o digest ou renovar a
# justificativa).
#
# Componentes afetados, nenhum usado pela aplicacao:
#   - mysqlsh (MySQL Shell, Python) em /usr/lib/mysqlsh: ferramenta
#     administrativa/interativa; o container inicia apenas o mysqld.
#   - gosu em /usr/local/bin/gosu: usado pelo entrypoint da imagem apenas para
#     trocar para o usuario mysql; nao processa rede, TLS ou entrada externa.
# Os binarios sao embutidos pela Oracle na imagem oficial; nao ha como
# atualiza-los sem reconstruir a imagem inteira a partir do upstream.

vulnerabilities:
  # mysqlsh - dependencias Python (usr/lib/mysqlsh)
  - id: GHSA-6q48-6c7w-9gw2
    statement: certifi embutido no mysqlsh; componente administrativo nao usado pela aplicacao
    expired_at: 2027-02-28
  - id: CVE-2026-69247
    statement: cryptography embutida no mysqlsh; componente administrativo nao usado pela aplicacao
    expired_at: 2027-02-28
  - id: CVE-2026-69249
    statement: cryptography embutida no mysqlsh; componente administrativo nao usado pela aplicacao
    expired_at: 2027-02-28
  - id: GHSA-537c-gmf6-5ccf
    statement: OpenSSL embutido no wheel de cryptography do mysqlsh; componente nao usado
    expired_at: 2027-02-28
  - id: CVE-2026-27459
    statement: pyOpenSSL embutido no mysqlsh; componente administrativo nao usado pela aplicacao
    expired_at: 2027-02-28
  - id: CVE-2026-44431
    statement: urllib3 embutido no mysqlsh; componente administrativo nao usado pela aplicacao
    expired_at: 2027-02-28
  - id: CVE-2026-44432
    statement: urllib3 embutido no mysqlsh; componente administrativo nao usado pela aplicacao
