# Override de producao para o drive dedicado montado em /mnt/visitantes.
#
# Este arquivo COMPLEMENTA o docker-compose.yml (nao o substitui): apenas
# redireciona os volumes de dados — banco e fotos — para o drive dedicado.
# O restante da stack (hardening, redes, limites, versoes) continua definido
# somente no docker-compose.yml, que segue sendo a fonte unica da stack.
#
# Uso (escolha uma das formas):
#   1. Explicito:
#      docker compose -f docker-compose.yml -f docker-compose-producao.yml up -d --build
#   2. Automatico via .env (nao commitado) — depois basta `docker compose up`:
#      echo 'COMPOSE_FILE=docker-compose.yml:docker-compose-producao.yml' >> .env
#
# Prepare o drive no host uma unica vez:
#   sudo mkdir -p /mnt/visitantes/mysql /mnt/visitantes/fotos
#   sudo chown 999:999   /mnt/visitantes/mysql   # uid do mysql no container
#   sudo chown 1000:1000 /mnt/visitantes/fotos   # uid do app no container
#
# Caminhos (defaults abaixo; sobrescreva em .env se precisar):
#   DB_DATA_DIR - dados do MySQL (default: /mnt/visitantes/mysql)
#   FOTOS_DIR   - fotos dos visitantes (default: /mnt/visitantes/fotos)
services:
  app:
    volumes:
      # Fotos dos visitantes no drive dedicado.
      # No host: chown 1000:1000 ${FOTOS_DIR:-/mnt/visitantes/fotos}
      - ${FOTOS_DIR:-/mnt/visitantes/fotos}:/var/www/html/fotos_visitantes

  db:
    volumes:
      # Dados do MySQL no drive dedicado.
      # No host: chown 999:999 ${DB_DATA_DIR:-/mnt/visitantes/mysql}
      - ${DB_DATA_DIR:-/mnt/visitantes/mysql}:/var/lib/mysql
