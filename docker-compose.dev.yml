# Override para desenvolvimento: adiciona phpMyAdmin.
# Uso: não é necessário para o funcionamento do sistema, apenas para facilitar a administração do banco de dados.
# NAO utilizar em producao.
services:
  app:
    build:
      args:
        ENVIRONMENT: development
  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 50M
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 256m
    pids_limit: 128