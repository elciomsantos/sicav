# Reverse proxy do Sistema de Visitantes - executado no container "nginx".
# Montado em /etc/nginx/conf.d/default.conf (ver docker-compose.yml).
#
# O container nginx e o unico que publica porta no host (NGINX_PORT, padrao 8000)
# e encaminha para o container "app" pela rede interna "frontend".
# Em producao o endereco e http://10.10.10.208:8000 (rede interna local).
#
# Para outro sistema no mesmo servidor, use outro NGINX_PORT e outro nome de
# projeto/container (ex.: docker compose -p outro-sistema up -d).

upstream sistema_visitantes_app {
    server app:80;
    keepalive 16;
}

# Formato de acesso com request_id: permite correlacionar a linha do nginx com
# o evento AUDIT emitido pelo PHP (inc/log_event.php), que reutiliza este mesmo
# ID via header X-Request-ID.
log_format visitantes '$request_id $remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Alinhado ao PHP do container (post_max_size = 12M, upload_max_filesize = 10M)
    client_max_body_size 12m;

    # Logs no stdout/stderr para aparecerem em "docker compose logs nginx"
    access_log /dev/stdout visitantes;
    error_log  /dev/stderr;

    location / {
        proxy_pass http://sistema_visitantes_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Repassa o host real para o app montar URLs/redirects corretos
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # $request_id e gerado pelo nginx por requisicao (nunca vem do cliente):
        # o valor segue ate o PHP e vira o request_id da trilha de auditoria.
        proxy_set_header X-Request-ID      $request_id;

        # Tempo para uploads/migracoes (PHP max_execution_time = 120s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
