name: Security scanning

on:
  push:
    branches: [main, fix/dev-development]
  pull_request:
    branches: [main, fix/dev-development]
  schedule:
    # Toda segunda-feira as 03:17 UTC
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CodeQL nao suporta mais PHP; a analise do PHP e feita pelo job
        # phpstan (SARIF) abaixo. JavaScript/TypeScript e GitHub Actions
        # rodam com build-mode none.
        language: ['javascript-typescript', 'actions']
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Linguagens interpretadas usam build-mode none
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  phpstan:
    name: PHPStan (SARIF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, gd, pdo, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G \
            --error-format=sarif > phpstan.sarif

      - name: Upload to code scanning
        # PRs do Dependabot rodam com token somente leitura, sem
        # permissao de security-events:write; nesses casos so pulamos o upload.
        if: always() && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpstan.sarif
          category: '/tool:phpstan'

  psalm:
    name: Psalm (taint analysis, SARIF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Taint analysis (fontes $_GET/$_POST -> sinks SQL/HTML/shell): falha o
      # job quando um novo fluxo inseguro aparece. O baseline cobre apenas
      # divida de quality pre-existente; findings de seguranca nunca entram.
      - name: Run Psalm
        run: |
          vendor/bin/psalm --no-progress \
            --report-show-info=false --report=psalm.sarif

      - name: Upload to code scanning
        # PRs do Dependabot rodam com token somente leitura, sem
        # permissao de security-events:write; nesses casos so pulamos o upload.
        if: always() && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psalm.sarif
          category: '/tool:psalm'
